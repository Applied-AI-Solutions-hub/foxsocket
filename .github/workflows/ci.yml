name: Foxsocket checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm exec electron chat-persist-smoke.cjs
      - run: pnpm exec electron backup-smoke.cjs
      - run: pnpm exec electron host-smoke.cjs
      - run: pnpm exec electron updates-smoke.cjs
      - run: pnpm exec electron host-lifecycle-smoke.cjs
      - run: pnpm exec electron host-lifecycle-smoke.cjs --preparing
