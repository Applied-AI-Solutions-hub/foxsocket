name: Windows signed installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-signed-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.ref == 'refs/heads/main'
    environment: windows-signing
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require configured signing
        run: node -e "require('./build/windows-signing.cjs')(process.env)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Electron build runtime
        run: node node_modules/electron/install.js
      - name: Check Host setup
        run: |
          node --test build/windows-signing.test.cjs host-manager.test.cjs setup.test.cjs updates.test.cjs local-model.test.cjs local-runtime.test.cjs local-chat.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/host-setup.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/host-progress.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check normal chat request path
        run: pnpm exec electron local-chat-smoke.cjs
      - name: Check signature rejection gate
        run: ./build/verify-signature.test.ps1
      - name: Build and sign Windows installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing credential: $name" }
          }
          pnpm dist
      - name: Verify signed application and installer
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $report = 'release/signatures.jsonl'
          if (-not (Test-Path $report)) { throw 'Missing embedded uninstaller signature evidence' }
          $records = @(Get-Content $report | ForEach-Object { $_ | ConvertFrom-Json })
          if (-not ($records | Where-Object { $_.file -like '*__uninstaller.exe' -and $_.status -eq 'Valid' })) {
            throw 'Signed uninstaller was not verified before embedding'
          }
          & ./build/verify-signature.ps1 -Path "release/Foxsocket Setup $version.exe" -ReportPath $report
          & ./build/verify-signature.ps1 -Path 'release/win-unpacked/Foxsocket.exe' -ReportPath $report
          Get-ChildItem release/win-unpacked -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll', '.node', '.ps1') -and $_.Name -ne 'Foxsocket.exe' } | ForEach-Object {
            & ./build/verify-signature.ps1 -Path $_.FullName -ReportPath $report
          }
      - name: Check installer registration handling
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "$env:LOCALAPPDATA/electron-builder/Cache" -Recurse -Filter makensis.exe | Where-Object { $_.Directory.Name -ne 'Bin' } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler was not found after packaging' }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/install-identity.test.ps1 -MakeNsis $compiler.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare handoff files
        shell: pwsh
        env:
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Path test-installer | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "release/Foxsocket Setup $version.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination test-installer
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content test-installer/SHA256SUMS.txt
          @{
            version = $version
            tested_head_sha = $env:TEST_HEAD_SHA
            checkout_sha = (git rev-parse HEAD)
            signatures = @(Get-Content release/signatures.jsonl | ForEach-Object { $_ | ConvertFrom-Json })
            protected_windows_acceptance = 'pending Lenovo launch/install/uninstall test'
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Depth 6 | Set-Content test-installer/BUILD-INFO.json
          Copy-Item LENOVO-START-HERE.md test-installer
      - name: Upload the installer and test instructions
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Foxsocket-Windows-signed-test-installer
          path: test-installer/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "## Lenovo test installer" >> $env:GITHUB_STEP_SUMMARY
          "[Download installer, checksum, and shared instructions]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "This is a test build. Verify local Ollama installation, a selected-model reply, and recovery after restarting the Lenovo." >> $env:GITHUB_STEP_SUMMARY
