name: Windows test installer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Electron build runtime
        run: node node_modules/electron/install.js
      - name: Check Host setup
        run: |
          node --test host-manager.test.cjs setup.test.cjs updates.test.cjs local-model.test.cjs local-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/host-setup.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/host-progress.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        run: pnpm dist
      - name: Prepare handoff files
        shell: pwsh
        env:
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Path test-installer | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "release/Foxsocket Setup $version.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination test-installer
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content test-installer/SHA256SUMS.txt
          @{
            version = $version
            tested_head_sha = $env:TEST_HEAD_SHA
            checkout_sha = (git rev-parse HEAD)
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content test-installer/BUILD-INFO.json
          Copy-Item LENOVO-START-HERE.md test-installer
      - name: Upload the installer and test instructions
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Foxsocket-Windows-test-installer
          path: test-installer/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "## Lenovo test installer" >> $env:GITHUB_STEP_SUMMARY
          "[Download installer, checksum, and shared instructions]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "This is a test build. Verify local Ollama installation, a selected-model reply, and recovery after restarting the Lenovo." >> $env:GITHUB_STEP_SUMMARY
