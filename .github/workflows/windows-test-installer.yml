name: Windows PR validation

on:
  pull_request:
    branches: [main, fix/installer-host-prerequisites]

permissions:
  contents: read

concurrency:
  group: windows-test-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FOXSOCKET_UNSIGNED_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Electron build runtime
        run: node node_modules/electron/install.js
      - name: Check Host setup
        run: |
          node --test build/windows-signing.test.cjs host-manager.test.cjs setup.test.cjs updates.test.cjs local-model.test.cjs local-runtime.test.cjs local-chat.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/host-setup.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/host-progress.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check normal chat request path
        run: pnpm exec electron local-chat-smoke.cjs
      - name: Check signature rejection gate
        run: ./build/verify-signature.test.ps1
      - name: Build Windows installer
        run: pnpm dist
      - name: Check installer registration handling
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "$env:LOCALAPPDATA/electron-builder/Cache" -Recurse -Filter makensis.exe | Where-Object { $_.Directory.Name -ne 'Bin' } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler was not found after packaging' }
          powershell -NoProfile -ExecutionPolicy Bypass -File build/install-identity.test.ps1 -MakeNsis $compiler.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explain validation result
        run: |
          "Packaging checks passed. This PR build is unsigned and is not published for installation." >> $env:GITHUB_STEP_SUMMARY
          "A signed installer requires the protected Windows signed installer workflow. See docs/windows-signing.md." >> $env:GITHUB_STEP_SUMMARY
